apiVersion: batch/v1
kind: Job
metadata:
  name: nlp-ticket-classification-job
spec:
  template:
    spec:
      containers:
      - name: nlp-pipeline
        image: nlp-ticket-classification:latest
        imagePullPolicy: IfNotPresent  # For local testing with Minikube
        # If using external registry, change to Always
        command: ["python", "src/main.py"]
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      restartPolicy: Never
  backoffLimit: 1
